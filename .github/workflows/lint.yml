name: "Lint"

# Runs the automatable checks from the PR template on every pull request
# and on pushes to main, plus the headless unit tests. Tool versions come from rokit.toml
# (single source of truth).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: "StyLua - Selene - Rojo build"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Install toolchain (rokit.toml)"
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          cache: true

      - name: "StyLua (format check)"
        run: stylua --check src tests

      - name: "Selene (lint)"
        run: selene src

      # Tests run under Lune, so they use their own config with plain Luau globals.
      - name: "Selene (lint tests)"
        run: selene --config tests/selene.toml tests

      # Kept in this job on purpose: its name is the required status check in the main
      # ruleset, so a failing test blocks the merge. A separate job would not.
      - name: "Unit tests (Lune)"
        run: lune run tests

      - name: "Rojo build (every Place)"
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          projects=(places/*.project.json)
          if [ "${#projects[@]}" -eq 0 ]; then
            echo "::error::No Place projects found in places/"
            exit 1
          fi
          mkdir -p build
          for project in "${projects[@]}"; do
            place="$(basename "$project" .project.json)"
            rojo build "$project" -o "build/ci-$place.rbxl"
          done

      - name: "Rojo build (default alias)"
        run: rojo build default.project.json -o build/ci-default.rbxl
